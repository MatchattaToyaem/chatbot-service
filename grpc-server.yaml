location: australiaeast
resourceGroup: ai-platform
type: Microsoft.App/containerApps
name: grpc-server
identity:
  type: None
properties:
  environmentId: /subscriptions/53f34d3b-bdc7-4e68-89c4-0e4f1947eb31/resourceGroups/ai-platform/providers/Microsoft.App/managedEnvironments/managedEnvironment-aiplatform-8573
  configuration:
    registries:
      - server: oconnoraiplatform.azurecr.io
        username: oconnoraiplatform
        passwordSecretRef: acr-password
    secrets:
      - name: acr-password
        value: PLACEHOLDER_ACR
      - name: hf-token
        value: PLACEHOLDER_HF
    ingress:
      external: true
      targetPort: 50051
      transport: http2
      allowInsecure: false
  template:
    containers:
      - name: grpc-server
        image: oconnoraiplatform.azurecr.io/grpc-server:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: PORT
            value: "50051"
          - name: HUGGING_FACE_HUB_TOKEN
            secretRef: hf-token
          - name: LOG_FILE
            value: "/var/log/app/chatbot-service.log"
          - name: CHROMA_MODE
            value: "http"
          - name: CHROMADB_HOST
            value: "chroma-db-ai-platform.proudground-90080d26.australiaeast.azurecontainerapps.io"
          - name: CHROMADB_PORT
            value: "443"
          - name: CHROMADB_SSL
            value: "true"
          - name: COLLECTION_NAME
            value: "oconnors_ims"
          - name: HF_MODEL
            value: "meta-llama/Llama-3.2-3B-Instruct"
        volumeMounts:
          - volumeName: app-logs
            mountPath: /var/log/app

      - name: filebeat
        image: oconnoraiplatform.azurecr.io/filebeat:v5
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: ELASTICSEARCH_HOST
            value: "http://elasticsearch.internal.proudground-90080d26.australiaeast.azurecontainerapps.io:80"
          - name: ELASTICSEARCH_USERNAME
            value: "elastic"
          - name: ELASTICSEARCH_PASSWORD
            value: "KZjpxzuWoYx41YLhggNx"
          - name: APP_SERVICE
            value: "chatbot-service"
          - name: INDEX_NAME
            value: "chatbot-service"
          - name: FILEBEAT_TYPE
            value: "simple"
        volumeMounts:
          - volumeName: app-logs
            mountPath: /var/log/app

    volumes:
      - name: app-logs
        storageType: EmptyDir

    scale:
      minReplicas: 1
      maxReplicas: 3