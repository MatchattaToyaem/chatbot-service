syntax = "proto3";

package chatbotservice;

service HuggingFaceService {
  rpc GenerateResponse (PromptRequest) returns (InferenceReply) {}
}

message PromptRequest {
  string prompt = 1;
  string session_id = 2;
}

message Source {
  string file = 1;
  string subfolder = 2;
  float score = 3;
  string chunk_id = 4;
}

message InferenceReply {
  string result = 1;
  float confidence = 2;
  repeated Source sources = 3;
  string model = 4;
}
